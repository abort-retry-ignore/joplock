<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1e1a12" />
<meta http-equiv="refresh" content="8" />
<title>The Joplock demo is resetting</title>
<style>
	*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
	body { display: flex; align-items: center; justify-content: center; min-height: 100vh; min-height: 100dvh; padding: 24px; background: #1a1610; color: #e8e0d0; font: 16px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; }
	main { max-width: 360px; }
	h1 { font-size: 22px; margin-bottom: 8px; }
	p { color: #b8ad98; }
	.ring { width: 36px; height: 36px; margin: 0 auto 20px; border: 3px solid #4a4030; border-top-color: #d9a441; border-radius: 50%; animation: spin 0.9s linear infinite; }
	@keyframes spin { to { transform: rotate(360deg); } }
	@media (prefers-reduced-motion: reduce) { .ring { animation: none; } }
</style>
</head>
<body>
<main>
	<div class="ring" aria-hidden="true"></div>
	<h1>The demo is resetting</h1>
	<p>Every 30 minutes all changes are wiped and the example notes come back. This takes a few seconds; the page reloads by itself.</p>
</main>
</body>
</html>
