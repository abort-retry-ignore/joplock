# Full stack: Postgres + Joplin Server + Joplock, all from published images. Needs only Docker.
#
# Try it:
#   1. Set JOPLOCK_ADMIN_EMAIL and JOPLOCK_ADMIN_PASSWORD below. REQUIRED: this is the account you
#      sign in with. The password needs 12+ characters using 3 of: lower case, upper case, digits,
#      symbols; with a weaker one Joplock stops with an error (docker compose ... logs joplock).
#   2. docker compose -f docker-compose.example-full.yml up -d
#   3. Open http://localhost:5444 (or http://<this machine>:5444 from another device) and sign in.
#      The first start takes about half a minute while Joplin Server creates its database.
#
# Joplin Server's own default account (admin@localhost / admin) is locked automatically: use the
# account from step 1.
#
# Before keeping real notes in it, also change:
#   - POSTGRES_PASSWORD, the same value in db, server and joplock (the database is not reachable
#     from outside Docker, but do not keep the example password)
#   - the host port in '5444:3001' if 5444 is taken
#   - JOPLOCK_PUBLIC_BASE_URL once Joplock sits behind a reverse proxy; to sync the Joplin desktop
#     and mobile apps through it, see "Vault Safety With Sync Clients" in the README
#
# Joplock UI:      http://localhost:5444
# Joplin Server:   internal only (not exposed to the host)
#
# Note: On WSL2, the raw WSL IP may not be reliably reachable from browsers.
# A Windows host port proxy or a Tailscale DNS name can work better.

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: joplin
      POSTGRES_PASSWORD: joplin
      POSTGRES_DB: joplin
    volumes:
      - db_data:/var/lib/postgresql

  server:
    image: joplin/server:latest
    restart: unless-stopped
    depends_on:
      - db
    environment:
      APP_PORT: 22300
      # Internal base URL — Joplin Server is not exposed to the host.
      # Joplock proxies writes to it over the internal Docker network.
      APP_BASE_URL: http://server:22300
      # Set to false to disable new user self-registration
      SIGNUP_ENABLED: 'true'
      DB_CLIENT: pg
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: joplin
      POSTGRES_USER: joplin
      POSTGRES_PASSWORD: joplin

  joplock:
    image: ghcr.io/abort-retry-ignore/joplock:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '5444:3001'
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      # Public URL where Joplock is reachable. Not needed to try it (other devices on
      # your network work as is); set it to the reverse-proxy URL when there is one.
      JOPLOCK_PUBLIC_BASE_URL: http://localhost:5444
      # Internal URL Joplock uses to talk to Joplin Server
      JOPLIN_SERVER_ORIGIN: http://server:22300
      # Joplin Server is not publicly exposed in this example.
      # Desktop/mobile sync clients cannot connect directly — Joplock is the only UI.
      # To expose Joplin Server for sync clients, add a ports mapping to the server
      # service and set this to its public URL (e.g. http://10.0.1.14:22300).
      JOPLIN_SERVER_PUBLIC_URL: http://server:22300
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: joplin
      POSTGRES_USER: joplin
      POSTGRES_PASSWORD: joplin
      # REQUIRED: the account you sign in with, created on first start (an admin).
      # Password: 12+ characters using 3 of lower case, upper case, digits, symbols.
      JOPLOCK_ADMIN_EMAIL: ''
      JOPLOCK_ADMIN_PASSWORD: ''
      # Set to true to skip MFA check for the admin account defined above
      IGNORE_ADMIN_MFA: 'false'
      # Full database backup storage inside the container
      JOPLOCK_BACKUP_DIR: /backups
      # Optional break-glass recovery mode for backup/restore
      JOPLOCK_RECOVERY_ENABLED: 'false'
      JOPLOCK_RECOVERY_PASSWORD: ''
      # Startup default for debug logging (server + browser console). Admins can
      # override this at runtime via Settings > Admin > "Enable debug logging".
      DEBUG: 'false'
    volumes:
      - backup_data:/backups

volumes:
  db_data:
  backup_data:
